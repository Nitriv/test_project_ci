stages:
  - lint
  - test

image: python:3.11-slim

before_script:
  - pip install --upgrade pip
  - pip install -r requirements.txt

# --- ЭТАП 1: ЛИНТЕРЫ ---

flake8:
  stage: lint
  script:
    - flake8 .

isort:
  stage: lint
  script:
    - isort --check-only --diff .

black:
  stage: lint
  script:
    - black --check --diff .

mypy:
  stage: lint
  script:
    - mypy .
  allow_failure: true

# --- ЭТАП 2: ТЕСТЫ ---

pytest:
  stage: test
  script:
    - pytest -v